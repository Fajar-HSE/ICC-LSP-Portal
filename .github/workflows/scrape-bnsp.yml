name: Scrape BNSP Status Mingguan

on:
  schedule:
    - cron: '0 7 * * 0'   # Setiap Minggu jam 07:00
  workflow_dispatch:      # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests urllib3

      - name: Scrape BNSP
        run: |
          python scrape_status_bnsp.py > bnsp_status_all.json 2>scrape_log.txt
          cat scrape_log.txt
          echo "Total LSP: $(python -c 'import json; d=json.load(open(\"bnsp_status_all.json\")); print(len(d))')"

      - name: Update Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python update_db.py 2>&1
