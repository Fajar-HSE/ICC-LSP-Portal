<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSP &amp; Skema Directory — ICC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="all">
<style>
:root {
  --primary: #004B87;
  --primary-light: #0066b3;
  --primary-dark: #003366;
  --accent: #F47920;
  --accent-light: #ff9633;
  --red: #E4002B;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
  --radius: 10px;
  --radius-sm: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  padding: 24px 32px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; cursor: pointer; }
.header-brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.header-brand span { font-size: 13px; opacity: .85; font-weight: 500; }
.logo-img { height: 42px; width: auto; display: block; }
.logo-fallback { font-size: 20px; font-weight: 700; color: #fff; }
.header-stats { display: flex; align-items: center; gap: 20px; font-size: 13px; flex-wrap: wrap; }
.header-stats .stat { text-align: center; }
.header-stats .num { font-size: 20px; font-weight: 700; }
.header-stats .stat-aktif { color: #16a34a; }
.header-stats .stat-habis { color: #dc2626; }
.header-stats .lbl { color: #dbeafe; font-size: 11px; }
.search-section {
  max-width: 1280px; margin: 0 auto; padding: 20px 32px 0;
}
.search-bar {
  display: flex; gap: 12px; flex-wrap: wrap;
  background: var(--card); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: var(--shadow);
}
.search-group { flex: 1; min-width: 200px; position: relative; }
.search-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.search-input-wrap { position: relative; }
.search-group input {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; transition: all .2s; background: var(--bg);
  padding-right: 36px;
}
.search-group input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0,75,135,.1); }
.search-group .clear-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; font-size: 16px; cursor: pointer;
  color: var(--text-light); display: none; padding: 4px 6px; border-radius: 4px;
  line-height: 1;
}
.search-group .clear-btn:hover { color: var(--text); background: var(--border); }
.search-group .clear-btn.show { display: block; }
.search-hint { font-size: 12px; color: var(--text-light); margin-top: 6px; }
.autocomplete {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); max-height: 320px; overflow-y: auto; display: none;
  margin-top: 2px;
}
.autocomplete.show { display: block; }
.autocomplete-item {
  padding: 10px 14px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; transition: background .1s;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.selected { background: #f0f7ff; }
.autocomplete-item .tag {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
  background: var(--bg); color: var(--text-muted); white-space: nowrap;
}
.autocomplete-item .highlight { color: var(--primary); font-weight: 600; }
.autocomplete-item .lsp-name { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.autocomplete-empty { padding: 12px 14px; font-size: 13px; color: var(--text-light); text-align: center; }
.th-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.th-sortable:hover { background: var(--primary-light); }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-pills .lsp-pill { padding: 5px 14px; font-size: 12px; }
.main { max-width: 1280px; margin: 0 auto; padding: 20px 32px 40px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card {
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 20px; box-shadow: var(--shadow); transition: all .2s;
  display: flex; flex-direction: column; height: 100%;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card-clickable { cursor: pointer; }
.card-clickable:hover { transform: translateY(-2px); }
.card-lsp { border-left: 4px solid var(--primary); }
.card-skema { border-left: 4px solid var(--accent); }
.card .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.card .sub { font-size: 12px; color: var(--text-muted); }
.card .badge-group { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.badge-primary { background: #e8f0fe; color: var(--primary); }
.badge-accent { background: #fef3e8; color: var(--accent); }
.badge-red { background: #fde8eb; color: var(--red); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.section-header h2 { font-size: 18px; font-weight: 700; }
.section-header .count { font-size: 13px; color: var(--text-muted); }
.table-wrap { overflow-x: auto; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  background: var(--primary); color: #fff; font-weight: 600; padding: 10px 16px;
  text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
  position: sticky; top: 0;
}
td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: #f8fafc; }
tr:last-child td { border-bottom: none; }
.kode-cell { font-family: 'Courier New', monospace; font-size: 13px; color: var(--primary); font-weight: 500; white-space: nowrap; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state p { font-size: 15px; }
.empty-state .sub { font-size: 13px; margin-top: 4px; }
.summary-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.summary-item {
  background: var(--card); padding: 14px 20px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); flex: 1; min-width: 140px;
}
.summary-item .num { font-size: 24px; font-weight: 800; color: var(--primary); }
.summary-item .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.summary-item.accent .num { color: var(--accent); }
.loading { text-align: center; padding: 60px; color: var(--text-light); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--card); cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 16px;
  transition: all .15s;
}
.back-btn:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }
.footer { text-align: center; padding: 24px; color: var(--text-light); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
.lsp-options { margin-bottom: 20px; }
.lsp-options .hint { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.lsp-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.lsp-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: 20px; border: 2px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s;
  font-family: inherit;
}
.lsp-pill:hover { border-color: var(--primary); color: var(--primary); }
.lsp-pill .count { font-size: 11px; color: var(--text-muted); }
.lsp-pill .check { display: none; }
.lsp-pill.selected { border-color: var(--primary); background: #e8f0fe; color: var(--primary); }
.lsp-pill.selected .check { display: inline; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
.page-btn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--card); cursor: pointer; font-size: 13px; font-family: inherit;
  transition: all .15s; display: inline-flex; align-items: center; justify-content: center; min-width: 36px;
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: .4; cursor: default; }
@media (max-width: 768px) {
  .header { padding: 16px; }
  .header-inner { flex-direction: column; align-items: flex-start; }
  .header-stats { width: 100%; justify-content: space-between; }
  .search-section { padding: 12px 16px 0; }
  .main { padding: 12px 16px 24px; }
  .search-bar { flex-direction: column; }
  .cards-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="header-brand" href="#" onclick="goHome(event)" aria-label="Kembali ke beranda">
      <img src="logo_icc.png" alt="ICC Logo" class="logo-img" onerror="this.style.display='none';var b=document.createElement('span');b.className='logo-fallback';b.textContent='ICC';b.setAttribute('role','img');b.setAttribute('aria-label','ICC Logo');this.parentNode.appendChild(b);">
      <div>
        <h1>ICC LSP Portal</h1>
        <span>Lembaga Sertifikasi Profesi — BNSP</span>
      </div>
    </a>
    <div class="header-stats" id="headerStats">
      <div class="stat"><div class="num" id="statLsp">-</div><div class="lbl">LSP</div></div>
      <div class="stat"><div class="num" id="statSkema">-</div><div class="lbl">Jenis Skema</div></div>
      <div class="stat"><div class="num" id="statUnit">-</div><div class="lbl">Unit Kompetensi</div></div>
      <div class="stat"><div class="num stat-aktif" id="statAktif">-</div><div class="lbl">Aktif</div></div>
      <div class="stat"><div class="num stat-habis" id="statHabis">-</div><div class="lbl">Masa Berlaku Habis</div></div>
    </div>
  </div>
</header>

<div class="search-section">
  <div class="search-bar">
    <div class="search-group">
      <label>Cari LSP</label>
      <div class="search-input-wrap">
        <input type="text" id="searchLsp" placeholder="Ketik nama LSP..." autocomplete="off">
        <button class="clear-btn" id="clearLsp" type="button" aria-label="Hapus pencarian LSP">✕</button>
      </div>
      <div class="autocomplete" id="acLsp"></div>
      <div class="search-hint">Misal: Administrator, Digital, K3, Migas</div>
    </div>
    <div class="search-group">
      <label>Cari Skema</label>
      <div class="search-input-wrap">
        <input type="text" id="searchSkema" placeholder="Ketik nama skema..." autocomplete="off">
        <button class="clear-btn" id="clearSkema" type="button" aria-label="Hapus pencarian Skema">✕</button>
      </div>
      <div class="autocomplete" id="acSkema"></div>
      <div class="search-hint">Misal: Digital Marketing, K3 Umum, Sekretaris</div>
    </div>
  </div>
</div>

<main class="main" id="mainContent">
  <div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>
</main>

<div class="footer">
  Indonesian Certification Center (ICC) — Data LSP BNSP
</div>

<script>
// ===== CONFIG =====
var SB_URL = 'https://ziybqtcdphuzhfoahopr.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeWJxdGNkcGh1emhmb2Fob3ByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3ODQ0NTUsImV4cCI6MjEwMDM2MDQ1NX0.pksC4kqaO3YIjqc2RQEEJnDiYYwu-HoT9vVoFRRi64I';

// ===== STATE =====
var lspList = [];
var skemaList = [];        // grouped by name (unique)
var skemaAllRows = [];     // raw rows for per-LSP filtering
var lspMap = {};           // id -> name
var acLspSelected = -1;
var acSkemaSelected = -1;
var currentView = 'home';  // 'home' | 'lsp' | 'skema'
var currentLspId = null;
var currentLspName = '';
var lspFilter = 'all';     // filter status di home: 'all' | 'aktif' | 'habis'
var lastUpdated = '';      // tanggal update data terakhir (max last_checked)
var unitRows = [];         // rows unit aktif utk sorting
var unitSortKey = 'kode';  // 'kode' | 'nama'
var unitSortDir = 1;       // 1 asc | -1 desc
var unitLspName = '';      // nama LSP utk header tabel unit

// ===== FETCH WITH PAGINATION =====
function fetchAll(table, select, pageSize) {
  pageSize = pageSize || 1000;
  var results = [];
  function getPage(start) {
    var end = start + pageSize - 1;
    var url = SB_URL + '/rest/v1/' + table + '?select=' + encodeURIComponent(select);
    return fetch(url, {
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + SB_KEY,
        Accept: 'application/json',
        Range: start + '-' + end
      }
    }).then(function(r) {
      return r.json().then(function(data) {
        if (!data || !data.length) return results;
        results = results.concat(data);
        if (data.length < pageSize) return results;
        return getPage(start + pageSize);
      });
    });
  }
  return getPage(0);
}

// ===== LOAD =====
// ===== BUILD DATA (extracted from Promise.all callback) =====
function buildData(lspRows, skemaRows, unitCount) {
  // Build LSP list
  lspList = lspRows.map(function(l) {
    return {
      nama: l.nama, jml_skema: l.jml_skema || 0, id: l.id, status: l.status || '',
      no_sk: l.no_sk || '', no_lisensi: l.no_lisensi || '', last_checked: l.last_checked || ''
    };
  });

  // Timestamp terakhir (max last_checked)
  var latest = '';
  lspRows.forEach(function(l) {
    if (l.last_checked && l.last_checked > latest) latest = l.last_checked;
  });
  if (latest) {
    var d = new Date(latest);
    lastUpdated = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  lspMap = {};
  lspList.forEach(function(l) { lspMap[l.id] = l.nama; });

  // All raw skema rows for per-LSP filtering + unit fetch
  skemaAllRows = skemaRows;

  // Recount jml_skema per LSP from actual skema rows (kolom DB bisa stale)
  var lspSkemaCount = {};
  skemaRows.forEach(function(s) {
    var key = String(s.lsp_id);
    if (!lspSkemaCount[key]) lspSkemaCount[key] = {};
    lspSkemaCount[key][s.nama] = true;
  });
  lspList.forEach(function(l) {
    var m = lspSkemaCount[String(l.id)];
    if (m) l.jml_skema = Object.keys(m).length;
  });

  // Group skema by name (case-insensitive key → no 'DATA ANALYST' / 'Data Analyst' dupes)
  var skemaGroup = {};
  skemaRows.forEach(function(s) {
    var key = s.nama.toLowerCase();
    if (!skemaGroup[key]) skemaGroup[key] = { nama: s.nama, lsps: {} };
    skemaGroup[key].lsps[s.lsp_id] = {
      id_skema: s.id_skema,
      jml_unit: s.jml_unit || 0,
      skema_id: s.id,
      lsp_id: parseInt(s.lsp_id)
    };
  });

  skemaList = Object.keys(skemaGroup).sort().map(function(key) {
    var g = skemaGroup[key];
    var lspArr = Object.keys(g.lsps).map(function(lid) {
      return {
        lsp: lspMap[lid] || 'Unknown',
        lsp_id: parseInt(lid),
        id_skema: g.lsps[lid].id_skema,
        jml_unit: g.lsps[lid].jml_unit,
        skema_id: g.lsps[lid].skema_id
      };
    });
    lspArr.sort(function(a, b) { return a.lsp.localeCompare(b.lsp); });
    return {
      nama: g.nama,
      jml_lsp: lspArr.length,
      total_unit: lspArr.reduce(function(s, o) { return s + o.jml_unit; }, 0),
      lsps: lspArr
    };
  });

  // Stats
  var aktif = 0, habis = 0;
  lspList.forEach(function(l) {
    if (l.status === 'Lisensi Aktif') aktif++;
    else if (l.status === 'Masa Berlaku Habis') habis++;
  });
  document.getElementById('statLsp').textContent = lspList.length;
  document.getElementById('statSkema').textContent = skemaList.length;
  var unitTotal = skemaList.reduce(function(s, o) { return s + o.total_unit; }, 0);
  document.getElementById('statUnit').textContent = unitCount ? unitCount.toLocaleString() : unitTotal.toLocaleString();
  document.getElementById('statAktif').textContent = aktif;
  document.getElementById('statHabis').textContent = habis;

  renderHome();
}

// ===== LOAD =====
function loadData() {
  document.getElementById('mainContent').innerHTML =
    '<div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>';

  // Fetch all 3 tables in parallel with full pagination
  var p1 = fetchAll('lsp', 'id,nama,jml_skema,status,no_sk,no_lisensi,last_checked');
  var p2 = fetchAll('skema', 'id,nama,id_skema,lsp_id,jml_unit');
  var p3 = fetchAll('unit_kompetensi', 'count');

  Promise.all([p1, p2, p3]).then(function(results) {
    var unitCount = 0;
    if (results[2] && results[2][0] && results[2][0].count !== undefined) {
      unitCount = parseInt(results[2][0].count, 10);
    }
    buildData(results[0], results[1], unitCount);
  }).catch(function(e) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat data</p><div class="sub">' + esc(e.message) + '</div></div>';
  });
}

// ===== HELPERS =====
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, query) {
  if (!query) return esc(text);
  var q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = new RegExp('(' + q + ')', 'gi');
  return esc(text).replace(re, '<span class="highlight">$1</span>');
}

// ===== HOME =====
function renderHome() {
  currentView = 'home';
  var html = '';

  // Filter status
  var cntAktif = 0, cntHabis = 0;
  lspList.forEach(function(l) {
    if (l.status === 'Lisensi Aktif') cntAktif++;
    else if (l.status === 'Masa Berlaku Habis') cntHabis++;
  });
  html += '<div class="section-header"><h2>LSP dengan Skema Terbanyak</h2>' +
    '<div class="filter-pills">' +
      '<button class="lsp-pill' + (lspFilter === 'all' ? ' selected' : '') + '" type="button" onclick="filterLsp(\'all\')"><span class="check">✓ </span>Semua (' + lspList.length + ')</button>' +
      '<button class="lsp-pill' + (lspFilter === 'aktif' ? ' selected' : '') + '" type="button" onclick="filterLsp(\'aktif\')"><span class="check">✓ </span>Aktif (' + cntAktif + ')</button>' +
      '<button class="lsp-pill' + (lspFilter === 'habis' ? ' selected' : '') + '" type="button" onclick="filterLsp(\'habis\')"><span class="check">✓ </span>Habis (' + cntHabis + ')</button>' +
    '</div></div>' +
    '<div class="section-sub" style="margin:-12px 0 16px;font-size:12px;color:var(--text-muted)">Top 6 LSP — diurutkan berdasarkan jumlah skema aktual</div>' +
    '<div class="cards-grid">';
  var top = lspList.slice().filter(function(l) {
    if (lspFilter === 'aktif') return l.status === 'Lisensi Aktif';
    if (lspFilter === 'habis') return l.status === 'Masa Berlaku Habis';
    return true;
  }).sort(function(a,b){ return b.jml_skema - a.jml_skema; }).slice(0, 6);
  if (top.length === 0) {
    html += '<div class="empty-state" style="padding:30px"><p>Tidak ada LSP dengan filter ini</p></div>';
  }
  top.forEach(function(l){
    html += '<div class="card card-lsp card-clickable" onclick="showLsp(\'' + esc(l.nama) + '\')">' +
      '<div class="title">' + esc(l.nama) + '</div>' +
      '<div class="sub">' + l.jml_skema + ' skema sertifikasi</div>' +
      '<div class="badge-group">' +
        '<span class="badge badge-primary">' + l.jml_skema + ' skema</span>' +
        (l.status === 'Lisensi Aktif' ? '<span class="badge" style="background:#dcfce7;color:#16a34a">✓ Aktif</span>' :
         l.status === 'Masa Berlaku Habis' ? '<span class="badge" style="background:#fef2f2;color:#dc2626">✕ Habis</span>' : '') +
      '</div></div>';
  });
  html += '</div>';

  html += '<div class="section-header"><h2>Skema Tersedia</h2><span class="count">' + skemaList.length + ' jenis skema</span></div><div class="cards-grid" id="skemaGrid">';
  // Show first 24
  for (var i = 0; i < Math.min(24, skemaList.length); i++) {
    var s = skemaList[i];
    html += '<div class="card card-skema card-clickable" onclick="searchSkemaAndPickLsp(\'' + esc(s.nama) + '\')">' +
      '<div class="title">' + esc(s.nama) + '</div>' +
      '<div class="sub">' + s.jml_lsp + ' LSP • ' + s.total_unit + ' unit</div>' +
      '<div class="badge-group"><span class="badge badge-accent">' + s.total_unit + ' unit</span></div></div>';
  }
  html += '</div>';

  if (skemaList.length > 24) {
    html += '<div class="pagination" id="skemaPagination"></div>';
  }

  document.getElementById('mainContent').innerHTML = html;

  if (skemaList.length > 24) {
    renderSkemaPagination(1);
  }
}

// ===== FILTER STATUS + GO HOME =====
function filterLsp(status) {
  lspFilter = status;
  renderHome();
}

function goHome(e) {
  if (e) e.preventDefault();
  // reset kedua pencarian & autocomplete
  if (searchLspInput) searchLspInput.value = '';
  if (searchSkemaInput) searchSkemaInput.value = '';
  if (clearLsp) clearLsp.classList.remove('show');
  if (clearSkema) clearSkema.classList.remove('show');
  if (acLsp) acLsp.classList.remove('show');
  if (acSkema) acSkema.classList.remove('show');
  lspFilter = 'all';
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

var skemaPageSize = 24;
var skemaCurrentPage = 1;

function renderSkemaPagination(page) {
  skemaCurrentPage = page;
  var grid = document.getElementById('skemaGrid');
  if (!grid) return;
  var start = (page - 1) * skemaPageSize;
  var end = Math.min(start + skemaPageSize, skemaList.length);
  var html = '';
  for (var i = start; i < end; i++) {
    var s = skemaList[i];
    html += '<div class="card card-skema card-clickable" onclick="searchSkemaAndPickLsp(\'' + esc(s.nama) + '\')">' +
      '<div class="title">' + esc(s.nama) + '</div>' +
      '<div class="sub">' + s.jml_lsp + ' LSP • ' + s.total_unit + ' unit</div>' +
      '<div class="badge-group"><span class="badge badge-accent">' + s.total_unit + ' unit</span></div></div>';
  }
  grid.innerHTML = html;

  var totalPages = Math.ceil(skemaList.length / skemaPageSize);
  var phtml = '';
  phtml += '<button class="page-btn" type="button" onclick="renderSkemaPagination(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>← Prev</button>';
  for (var p = Math.max(1, page - 2); p <= Math.min(totalPages, page + 2); p++) {
    phtml += '<button class="page-btn' + (p === page ? ' active' : '') + '" type="button" onclick="renderSkemaPagination(' + p + ')">' + p + '</button>';
  }
  phtml += '<button class="page-btn" type="button" onclick="renderSkemaPagination(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>Next →</button>';
  document.getElementById('skemaPagination').innerHTML = phtml;
}

// ===== SEARCH LSP =====
var searchLspInput = document.getElementById('searchLsp');
var acLsp = document.getElementById('acLsp');
var clearLsp = document.getElementById('clearLsp');

searchLspInput.addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  clearLsp.classList.toggle('show', q.length > 0);
  if (q.length < 1) { acLsp.classList.remove('show'); if (currentView === 'home') return; renderHome(); return; }
  var starts = lspList.filter(function(l) { return l.nama.toLowerCase().startsWith(q); });
  var includes = lspList.filter(function(l) { return l.nama.toLowerCase().includes(q) && !l.nama.toLowerCase().startsWith(q); });
  var matches = starts.concat(includes).slice(0, 8);
  if (matches.length === 0) {
    acLsp.innerHTML = '<div class="autocomplete-empty">Tidak ditemukan</div>';
    acLsp.classList.add('show');
    return;
  }
  acLspSelected = -1;
  var html = '';
  matches.forEach(function(m) {
    html += '<div class="autocomplete-item" onclick="selectLsp(\'' + esc(m.nama) + '\')">' +
      '<span>' + highlight(m.nama, searchLspInput.value) + '</span></div>';
  });
  acLsp.innerHTML = html;
  acLsp.classList.add('show');
});

searchLspInput.addEventListener('keydown', function(e) {
  var items = acLsp.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acLspSelected = Math.min(acLspSelected + 1, items.length - 1); highlightAc(items); }
  if (e.key === 'ArrowUp') { e.preventDefault(); acLspSelected = Math.max(acLspSelected - 1, -1); highlightAc(items); }
  if (e.key === 'Enter' && acLspSelected >= 0 && items[acLspSelected]) { items[acLspSelected].click(); }
  if (e.key === 'Escape') { acLsp.classList.remove('show'); }
});

function highlightAc(items) {
  items.forEach(function(el, i) { el.classList.toggle('selected', i === acLspSelected); });
}

function selectLsp(name) {
  searchLspInput.value = name;
  acLsp.classList.remove('show');
  showLsp(name);
}

clearLsp.addEventListener('click', function() {
  searchLspInput.value = '';
  clearLsp.classList.remove('show');
  acLsp.classList.remove('show');
  renderHome();
});

// ===== SEARCH SKEMA =====
var searchSkemaInput = document.getElementById('searchSkema');
var acSkema = document.getElementById('acSkema');
var clearSkema = document.getElementById('clearSkema');

searchSkemaInput.addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  clearSkema.classList.toggle('show', q.length > 0);
  if (q.length < 1) { acSkema.classList.remove('show'); return; }
  var starts = skemaList.filter(function(s) { return s.nama.toLowerCase().startsWith(q); });
  var includes = skemaList.filter(function(s) { return s.nama.toLowerCase().includes(q) && !s.nama.toLowerCase().startsWith(q); });
  var matches = starts.concat(includes).slice(0, 8);
  if (matches.length === 0) {
    acSkema.innerHTML = '<div class="autocomplete-empty">Tidak ditemukan</div>';
    acSkema.classList.add('show');
    return;
  }
  acSkemaSelected = -1;
  var html = '';
  matches.forEach(function(m) {
    html += '<div class="autocomplete-item" onclick="searchSkemaAndPickLsp(\'' + esc(m.nama) + '\')">' +
      '<span>' + highlight(m.nama, searchSkemaInput.value) + '</span>' +
      ' <span class="tag">' + m.jml_lsp + ' LSP</span></div>';
  });
  acSkema.innerHTML = html;
  acSkema.classList.add('show');
});

searchSkemaInput.addEventListener('keydown', function(e) {
  var items = acSkema.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acSkemaSelected = Math.min(acSkemaSelected + 1, items.length - 1); highlightAc(items); }
  if (e.key === 'ArrowUp') { e.preventDefault(); acSkemaSelected = Math.max(acSkemaSelected - 1, -1); highlightAc(items); }
  if (e.key === 'Enter' && acSkemaSelected >= 0 && items[acSkemaSelected]) { items[acSkemaSelected].click(); }
  if (e.key === 'Escape') { acSkema.classList.remove('show'); }
});

clearSkema.addEventListener('click', function() {
  searchSkemaInput.value = '';
  clearSkema.classList.remove('show');
  acSkema.classList.remove('show');
  renderHome();
});

// ===== SKEMA DETAIL (pick LSP → show units) =====
function searchSkemaAndPickLsp(name) {
  currentView = 'skema';
  searchSkemaInput.value = name;
  acSkema.classList.remove('show');
  clearSkema.classList.add('show');

  var skema = null;
  for (var i = 0; i < skemaList.length; i++) {
    if (skemaList[i].nama === name) { skema = skemaList[i]; break; }
  }
  if (!skema || skema.lsps.length === 0) {
    document.getElementById('mainContent').innerHTML =
      '<button class="back-btn" type="button" onclick="clearSkema.click()">← Kembali</button>' +
      '<div class="empty-state"><div class="icon">🔍</div><p>Skema tidak ditemukan</p></div>';
    return;
  }

  var html = '<button class="back-btn" type="button" onclick="clearSkema.click()">← Kembali</button>';
  html += '<div class="card card-skema" style="margin-bottom:20px">' +
    '<div class="title" style="font-size:20px">' + esc(skema.nama) + '</div>' +
    '<div class="sub" style="margin-top:4px">Tersedia di ' + skema.jml_lsp + ' LSP — total ' + skema.total_unit + ' unit kompetensi</div>' +
    '</div>';
  html += '<div class="lsp-options">' +
    '<div class="hint">Pilih LSP untuk melihat daftar unit kompetensi:</div>' +
    '<div class="lsp-pills">';
  skema.lsps.forEach(function(o, idx) {
    html += '<button class="lsp-pill" type="button" onclick="showSkemaDetail(\'' + esc(name) + '\', ' + idx + ', this)">' +
      '<span class="check">✓ </span>' + esc(o.lsp) + ' <span class="count">(' + o.jml_unit + ' unit)</span></button>';
  });
  html += '</div></div>';
  html += '<div id="skemaLspInfo"></div>';
  html += '<div id="skemaUnitTable"></div>';
  document.getElementById('mainContent').innerHTML = html;

  // Auto-load if only 1 LSP
  if (skema.lsps.length === 1) {
    var firstPill = document.querySelector('.lsp-pill');
    if (firstPill) firstPill.click();
  }
}

function showSkemaDetail(skemaName, lspIdx, btnEl) {
  var skema = null;
  for (var i = 0; i < skemaList.length; i++) {
    if (skemaList[i].nama === skemaName) { skema = skemaList[i]; break; }
  }
  if (!skema) return;
  var opt = skema.lsps[lspIdx];
  if (!opt) return;

  var allPills = document.querySelectorAll('.lsp-pill');
  allPills.forEach(function(p) { p.classList.remove('selected'); });
  if (btnEl) btnEl.classList.add('selected');

  // Info LSP pemilik skema ini (lookup dari lspList via lsp_id)
  var infoEl = document.getElementById('skemaLspInfo');
  if (infoEl) {
    var lsp = null;
    for (var i = 0; i < lspList.length; i++) {
      if (lspList[i].id === opt.lsp_id) { lsp = lspList[i]; break; }
    }
    infoEl.innerHTML =
      '<div class="card card-lsp" style="margin-bottom:20px">' +
        '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:start">' +
          '<div><div style="font-size:18px;font-weight:700">' + esc(lsp ? lsp.nama : opt.lsp) + '</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin-top:2px">Lembaga Sertifikasi Profesi</div></div>' +
          (lsp && lsp.status === 'Lisensi Aktif' ? '<span class="badge" style="background:#dcfce7;color:#16a34a">✓ Lisensi Aktif</span>' :
           lsp && lsp.status === 'Masa Berlaku Habis' ? '<span class="badge" style="background:#fef2f2;color:#dc2626">✕ Masa Berlaku Habis</span>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px">' +
          '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)">No SK</div>' +
            '<div style="font-size:14px;font-weight:600;margin-top:2px">' + esc((lsp && lsp.no_sk) || '—') + '</div></div>' +
          '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)">No Lisensi</div>' +
            '<div style="font-size:14px;font-weight:600;margin-top:2px">' + esc((lsp && lsp.no_lisensi) || '—') + '</div></div>' +
          '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)">Terakhir Diperiksa</div>' +
            '<div style="font-size:14px;font-weight:600;margin-top:2px">' + esc((lsp && lsp.last_checked) ? new Date(lsp.last_checked).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '—') + '</div></div>' +
        '</div></div>';
  }

  document.getElementById('skemaUnitTable').innerHTML =
    '<div class="loading" style="padding:30px"><div class="spinner"></div><p>Memuat unit...</p></div>';

  // Fetch units for this skema
  var url = SB_URL + '/rest/v1/unit_kompetensi?select=kode,nama&skema_id=eq.' + opt.skema_id + '&order=kode.asc';
  fetch(url, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Accept: 'application/json' }
  }).then(function(r) { return r.json(); }).then(function(units) {
    unitRows = units;
    unitSortKey = 'kode';
    unitSortDir = 1;
    unitLspName = opt.lsp;
    renderUnitTable();
  }).catch(function() {
    document.getElementById('skemaUnitTable').innerHTML = '<div class="empty-state"><p>Gagal memuat unit</p></div>';
  });
}

// ===== UNIT TABLE (sortable) =====
function renderUnitTable() {
  var rows = unitRows.slice().sort(function(a, b) {
    var va = String(a[unitSortKey] || '').toLowerCase();
    var vb = String(b[unitSortKey] || '').toLowerCase();
    if (va < vb) return -unitSortDir;
    if (va > vb) return unitSortDir;
    return 0;
  });
  var arrow = function(k) { return unitSortKey === k ? (unitSortDir === 1 ? ' ▲' : ' ▼') : ''; };
  var html = '<div class="section-header"><h2>Unit Kompetensi</h2>' +
    '<span class="count">' + esc(unitLspName) + ' — ' + unitRows.length + ' unit</span></div>';
  html += '<div class="table-wrap"><table><thead><tr>' +
    '<th style="width:40px">No</th>' +
    '<th style="width:220px" class="th-sortable" onclick="sortUnits(\'kode\')" aria-label="Urutkan kode unit">Kode Unit' + arrow('kode') + '</th>' +
    '<th class="th-sortable" onclick="sortUnits(\'nama\')" aria-label="Urutkan judul unit">Judul Unit Kompetensi' + arrow('nama') + '</th>' +
    '</tr></thead><tbody>';
  rows.forEach(function(u, idx) {
    html += '<tr><td>' + (idx + 1) + '</td><td class="kode-cell">' + esc(u.kode) + '</td><td>' + esc(u.nama) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('skemaUnitTable').innerHTML = html;
}

function sortUnits(key) {
  if (unitSortKey === key) {
    unitSortDir = -unitSortDir;
  } else {
    unitSortKey = key;
    unitSortDir = 1;
  }
  renderUnitTable();
}

// ===== LSP PAGINATION STATE =====
var lspSkemaNames = [];      // sorted skema names for current LSP
var lspCurrentPage = 1;
var lspPageSize = 24;

function renderLspSkema(page) {
  lspCurrentPage = page;
  var start = (page - 1) * lspPageSize;
  var end = Math.min(start + lspPageSize, lspSkemaNames.length);
  var html = '<div class="cards-grid">';
  for (var i = start; i < end; i++) {
    var nama = lspSkemaNames[i];
    // Find total units for this skema name across this LSP
    var totalUnit = 0;
    for (var j = 0; j < skemaAllRows.length; j++) {
      if (skemaAllRows[j].nama === nama && skemaAllRows[j].lsp_id === currentLspId) {
        totalUnit += (skemaAllRows[j].jml_unit || 0);
      }
    }
    html += '<div class="card card-skema card-clickable" onclick="showLspSkemaUnits(\'' + esc(nama) + '\')">' +
      '<div class="title">' + esc(nama) + '</div>' +
      '<div class="badge-group"><span class="badge badge-accent">' + totalUnit + ' unit</span></div></div>';
  }
  html += '</div>';

  var totalPages = Math.ceil(lspSkemaNames.length / lspPageSize);
  if (totalPages > 1) {
    html += '<div class="pagination">';
    html += '<button class="page-btn" type="button" onclick="renderLspSkema(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>← Prev</button>';
    for (var p = 1; p <= totalPages; p++) {
      html += '<button class="page-btn' + (p === page ? ' active' : '') + '" type="button" onclick="renderLspSkema(' + p + ')">' + p + '</button>';
    }
    html += '<button class="page-btn" type="button" onclick="renderLspSkema(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>Next →</button>';
    html += '</div>';
  }

  document.getElementById('lspSkemaGrid').innerHTML = html;
}

// ===== SHOW LSP DETAIL =====
function showLsp(name) {
  currentView = 'lsp';
  searchLspInput.value = name;
  clearLsp.classList.add('show');

  var lsp = null;
  for (var i = 0; i < lspList.length; i++) {
    if (lspList[i].nama === name) { lsp = lspList[i]; break; }
  }
  if (!lsp) return;

  // Get all skema belonging to this LSP from skemaAllRows
  var lspSkemaRows = skemaAllRows.filter(function(s) {
    return s.lsp_id === lsp.id;
  });

  // Group by name, sort
  var skemaByName = {};
  lspSkemaRows.forEach(function(s) {
    if (!skemaByName[s.nama]) skemaByName[s.nama] = true;
  });
  lspSkemaNames = Object.keys(skemaByName).sort();
  lspCurrentPage = 1;
  currentLspId = lsp.id;
  currentLspName = lsp.nama;

  var html = '<button class="back-btn" type="button" onclick="clearLsp.click()">← Kembali</button>';

  html += '<div class="card card-lsp" style="margin-bottom:20px">' +
    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
    '  <div><div style="font-size:20px;font-weight:700">' + esc(lsp.nama) + '</div>' +
    '  <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Lembaga Sertifikasi Profesi</div></div>' +
    '  <div style="display:flex;gap:8px;align-items:start">' +
      (lsp.status === 'Lisensi Aktif' ? '<span class="badge" style="background:#dcfce7;color:#16a34a;font-size:13px;padding:6px 14px">✓ Lisensi Aktif</span>' :
       lsp.status === 'Masa Berlaku Habis' ? '<span class="badge" style="background:#fef2f2;color:#dc2626;font-size:13px;padding:6px 14px">✕ Masa Berlaku Habis</span>' : '') +
      '<span class="badge badge-primary" style="font-size:13px;padding:6px 14px;align-self:start">' + lsp.jml_skema + ' Skema</span>' +
    '</div></div></div>';

  html += '<div class="section-header"><h2>Detail Lisensi</h2></div>' +
    '<div class="table-wrap" style="margin-bottom:20px"><table><tbody>' +
    '<tr><th style="width:180px;background:var(--bg);color:var(--text-muted)">Status Lisensi</th><td>' +
      (lsp.status === 'Lisensi Aktif' ? '<span class="badge" style="background:#dcfce7;color:#16a34a">✓ Lisensi Aktif</span>' :
       lsp.status === 'Masa Berlaku Habis' ? '<span class="badge" style="background:#fef2f2;color:#dc2626">✕ Masa Berlaku Habis</span>' : esc(lsp.status || '—')) +
    '</td></tr>' +
    '<tr><th style="width:180px;background:var(--bg);color:var(--text-muted)">No SK</th><td class="kode-cell">' + esc(lsp.no_sk || '—') + '</td></tr>' +
    '<tr><th style="width:180px;background:var(--bg);color:var(--text-muted)">No Lisensi</th><td class="kode-cell">' + esc(lsp.no_lisensi || '—') + '</td></tr>' +
    '<tr><th style="width:180px;background:var(--bg);color:var(--text-muted)">Terakhir Diperiksa</th><td>' + esc(lsp.last_checked ? new Date(lsp.last_checked).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '—') + '</td></tr>' +
    '</tbody></table></div>';

  html += '<div class="section-header"><h2>Skema Sertifikasi</h2><span class="count">' + lspSkemaNames.length + ' skema</span></div>';

  if (lspSkemaNames.length === 0) {
    html += '<div class="empty-state"><p>Tidak ada skema ditemukan untuk LSP ini</p></div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  html += '<div id="lspSkemaGrid"></div>';
  document.getElementById('mainContent').innerHTML = html;
  renderLspSkema(1);
}

// ===== SHOW UNIT KOMPETENSI DARI KARTU SKEMA DI DETAIL LSP =====
function showLspSkemaUnits(name) {
  var skema = null;
  for (var i = 0; i < skemaAllRows.length; i++) {
    if (skemaAllRows[i].lsp_id === currentLspId && skemaAllRows[i].nama === name) {
      skema = skemaAllRows[i]; break;
    }
  }
  if (!skema) return;

  var html = '<button class="back-btn" type="button" onclick="showLsp(\'' + esc(currentLspName) + '\')">← Kembali ke skema</button>';
  html += '<div class="card card-skema" style="margin-bottom:20px">' +
    '<div class="title" style="font-size:20px">' + esc(skema.nama) + '</div>' +
    '<div class="sub" style="margin-top:4px">' + esc(currentLspName) + ' — ' + (skema.jml_unit || 0) + ' unit kompetensi</div>' +
    '</div>';
  html += '<div id="skemaUnitTable"><div class="loading" style="padding:30px"><div class="spinner"></div><p>Memuat unit...</p></div></div>';
  document.getElementById('mainContent').innerHTML = html;

  unitRows = [];
  unitLspName = currentLspName;
  var url = SB_URL + '/rest/v1/unit_kompetensi?select=kode,nama&skema_id=eq.' + skema.id + '&order=kode.asc';
  fetch(url, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Accept: 'application/json' }
  }).then(function(r) { return r.json(); }).then(function(units) {
    unitRows = units;
    unitSortKey = 'kode';
    unitSortDir = 1;
    renderUnitTable();
  }).catch(function() {
    document.getElementById('skemaUnitTable').innerHTML = '<div class="empty-state"><p>Gagal memuat unit</p></div>';
  });
}

// ===== AUTO-HIDE =====
document.addEventListener('click', function(e) {
  var t = e.target;
  if (!t.closest('#searchLsp') && !t.closest('#acLsp')) acLsp.classList.remove('show');
  if (!t.closest('#searchSkema') && !t.closest('#acSkema')) acSkema.classList.remove('show');
});

// ===== INIT =====
loadData();
</script>
